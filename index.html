<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuff &mdash; Index</title>
<style>
  :root {
    --bg-start: #0f172a;
    --bg-end: #1e293b;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --card-hover-bg: rgba(255, 255, 255, 0.1);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.12), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 2.75rem);
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #f1f5f9 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    margin: 0;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 1rem;
  }

  li a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 1.0625rem;
    font-weight: 500;
    backdrop-filter: blur(8px);
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  li a:hover,
  li a:focus-visible {
    transform: translateY(-2px);
    background: var(--card-hover-bg);
    border-color: var(--accent);
    box-shadow: 0 8px 24px -8px var(--accent-glow);
    outline: none;
  }

  li a .arrow {
    color: var(--accent);
    font-size: 1.25rem;
    transition: transform 0.18s ease;
  }

  li a:hover .arrow,
  li a:focus-visible .arrow {
    transform: translateX(4px);
  }

  footer {
    margin-top: 3rem;
    color: var(--text-muted);
    font-size: 0.875rem;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Stuff</h1>
    <p class="subtitle">A collection of small tools and experiments.</p>
  </header>

  <ul>
    <li>
      <a href="wa-ctc-class-search.html">
        <span>Washington Community and Technical College Class Search</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </li>
    <li>
      <a href="x10.html">
        <span>Place Value Multiplication</span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </li>
  </ul>

  <footer>More coming soon.</footer>
</main>
</body>
</html>
